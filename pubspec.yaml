name: flutter_vrm
description: >-
  VRM 1.0 avatars on flutter_scene (Flutter GPU): humanoid poses, expressions,
  look-at, and auto blink, from a renderer-independent VRM parser.
version: 0.1.0-dev.1
repository: https://github.com/kiarina/flutter_vrm
issue_tracker: https://github.com/kiarina/flutter_vrm/issues
topics:
  - vrm
  - avatar
  - rendering
  - gltf

environment:
  sdk: ^3.10.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # Works with the published 0.23 and with upstream master (0.24 in progress).
  flutter_scene: ">=0.23.0 <0.25.0"
  hooks: ^2.2.0
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - flutter_scene_generated/
    - path: flutter_scene_generated/metal_ios/
      platforms: [ios]
    - path: flutter_scene_generated/metal_desktop/
      platforms: [macos]
    - path: flutter_scene_generated/opengl_es_vulkan/
      platforms: [android, linux, windows]
    - path: flutter_scene_generated/opengl_es/
      platforms: [web]
