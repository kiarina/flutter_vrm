name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Package
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test example/lib
          flutter analyze
          flutter test

      - name: Example
        working-directory: example
        run: |
          flutter pub get
          flutter analyze

      # The published flutter_scene must keep compiling too.
      - name: Against flutter_scene 0.23 (no overrides)
        run: |
          python3 - <<'PY'
          s = open('pubspec.yaml').read()
          open('pubspec.yaml', 'w').write(s[: s.index('dependency_overrides:')])
          PY
          flutter pub get
          flutter analyze lib
